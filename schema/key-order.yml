# Shared cross-port key-order table for the hand-written ghagen models.
#
# The one fact neither port could state about the other: the SEQUENCE of keys a
# model emits. Every existing guard is intra-port -- `spec.test.ts` compares a
# spec's emitted sequence to its own `fieldMap`, `test_spec.py` compares a
# spec's emitted sequence to its own `yaml_keys`, and each passes by
# construction because the sequence and its oracle are the same list. The only
# cross-port model table before this one, the conformance sweep, compared
# property NAMES as sets and never the order. Permuting one port's field map
# therefore changed its emitted YAML with both suites green.
#
# This file is that missing oracle. Each entry names a model kind and states:
#
#   order: `explicit` or `alphabetical` -- the spec's OrderMode.
#   keys:  the exact sequence of YAML keys the model emits, top to bottom.
#
# `on` is the sole `alphabetical` spec, and for it declaration order is UNREAD:
# the Emitter sorts every key at emit time, so permuting `On.yaml_keys` /
# `ON_SPEC.fieldMap` changes nothing observable and an order table over the
# declaration would be vacuous. Its `keys` below are therefore in EMITTED
# (sorted) order, like every other entry -- what the table binds is always what
# comes out, never what was written. The `order` field is bound too, so a spec
# that silently switched modes fails here rather than passing an order check
# that no longer means anything.
#
# Read by:
#   - Python (packages/python/tests/test_schema/test_conformance.py)
#   - TypeScript (packages/typescript/src/models/conformance.test.ts)
#
# Both sweeps also assert their model-kind set equals this file's key set, so a
# model added to one port and not the other fails a test instead of drifting.


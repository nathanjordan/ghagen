# Shared conformance allow-list for the hand-written ghagen models.
#
# Names the schema properties ghagen's ergonomic models intentionally do NOT
# expose, per canonical Snapshot and scope. Both conformance sweeps read this
# one file:
#
#   - Python (packages/python/tests/test_schema/test_conformance.py) walks each
#     Snapshot against the Pydantic model surface (model_fields reflection).
#   - TypeScript (packages/typescript/src/models/conformance.test.ts) walks the
#     same Snapshots against the ModelSpec fieldMaps.
#
# Because both ports are held to the SAME allow-list, both suites passing means
# the two ports model the same property set -- cross-port surface agreement,
# structurally. A property upstream but absent from a port's models (and not
# listed here) fails that port's sweep; a listed name no longer in the schema
# is flagged as stale.
#
# Every row is a claim, and both sweeps hold it to that claim three ways:
#   1. The named property must still exist upstream ("stale" otherwise).
#   2. The named property must still be UNCOVERED by the port's model
#      ("closed" otherwise) -- a gap someone fixed without deleting the row
#      would otherwise sit here forever, silently correct. This is what makes
#      recording a gap here a *test that the gap still exists*.
#   3. This file's own top-level snapshot keys, and each snapshot's scope
#      keys, must equal the sweep's exactly (`test_gap_set_matches_sweep` /
#      "gap set matches the sweep") -- so garbling a key here (e.g.
#      `workflow_schema` -> `workflow_schemas`) fails both suites even though
#      every list below is currently empty.
#
# Keys are <snapshot>.<scope>; the scope set is defined by each port's sweep.
# Every entry needs an inline comment: why the gap is intentional, or
# "# TODO: unmodeled" if it is a genuine gap worth tracking.
#
# Two reserved top-level keys are NOT snapshots, and are excluded from the
# snapshot/scope key comparison in (3). Each holds gaps of a different kind and
# carries its own header, at the bottom of this file:
#
#   constraints - a rule BETWEEN two properties that neither port enforces.
#   undeclared  - the sweep in the other direction: a key a port emits that the
#                 Snapshot does not declare. (Its own key set is compared to
#                 the sweep's separately, by its own test.)

workflow_schema:
  workflow: []
  job: []
  step:
    # The five keys of GitHub's background/parallel steps feature, added
    # upstream in the 2026-09-01 refresh. `parallel` is a recursive array of
    # steps and `wait-all` is a present-null keyword, so modelling the set is
    # a feature, not five fields -- filed as docs/issues/37.
    - background # TODO: unmodeled (issue 37)
    - cancel # TODO: unmodeled (issue 37)
    - parallel # TODO: unmodeled (issue 37)
    - wait # TODO: unmodeled (issue 37)
    - wait-all # TODO: unmodeled (issue 37)
  on: []
  pushTrigger: []
  prTrigger: []
  scheduleTrigger: []
  workflowDispatch: []
  workflowDispatchInput: []
  workflowCall: []
  workflowCallInput: []
  workflowCallOutput: []
  workflowCallSecret: []
  permissions: []
  container: []
  serviceContainer:
    # Upstream split `definitions.container` into `jobContainer` and
    # `serviceContainer`, and the service half gained two keys the job half
    # does not have. ghagen's Service model is still Container's shape, so
    # both are uncovered -- filed as docs/issues/37.
    - command # TODO: unmodeled (issue 37)
    - entrypoint # TODO: unmodeled (issue 37)
  strategy: []
  concurrency: []
  defaults: []
  defaultsRun: []
  environment: []
  imageSnapshot: []

action_schema:
  action: []
  compositeRuns: []
  dockerRuns: []
  nodeRuns: []
  actionInput: []
  actionOutput: []
  branding: []

# ---------------------------------------------------------------------------
# Cross-field constraint gaps.
#
# The rows above name a *property* the models do not expose. These name a
# *constraint between two properties of the same model* that neither port
# enforces. The distinction matters mechanically, not just editorially: a
# property gap is proved to still exist by the property's absence from the
# spec, which is a set-membership test. A cross-field constraint has no such
# footprint -- the fields are both present and both typed -- so the only way to
# prove the limit still exists is to CONSTRUCT the schema-invalid combination
# and observe that it succeeds.
#
# That is what each row here does, so a row is a live test in both directions,
# exactly like the property rows:
#
#   1. `requires` -- each path into the Snapshot must still hold the stated
#      value, so the row cannot outlive the upstream rule it describes.
#   2. `counterexample` -- constructing this input must still SUCCEED in this
#      port. Implement the conditional and the row turns red, forcing its
#      removal rather than leaving a stale "known limit" on record.
#
# In TypeScript the counterexample is additionally re-declared as a typed
# literal `satisfies` the model's input type in
# `packages/typescript/src/models/conformance-inputs.ts`, and the sweep
# deep-equals that literal against the one below. That is the port's only
# available proof, and the honest one: TypeScript could enforce this rule at
# compile time with a discriminated union, and if someone ever does, the
# `satisfies` stops compiling -- so the row is load-bearing there too, just at
# a different moment than Python's construction.
#
# Keys are <snapshot> -> <kind>.<field>. Each row needs `requires`,
# `counterexample`, `requires_prose`, and `unenforced`; both sweeps assert
# their bound key set equals this section's.
constraints:
  workflow_schema:
    workflowDispatchInput.default:
      kind: workflowDispatchInput
      requires:
        - path:
            [definitions, workflowDispatchInput, oneOf, 1, properties, type, const]
          value: boolean
        - path:
            [definitions, workflowDispatchInput, oneOf, 1, required]
          value: [type]
        - path:
            [
              definitions,
              workflowDispatchInput,
              oneOf,
              1,
              properties,
              default,
              type,
            ]
          value: boolean
      requires_prose: >-
        The Snapshot leaves `workflowDispatchInput.default` untyped in
        `properties` and constrains it from a five-branch `oneOf` keyed on the
        sibling `type`: `type: "string"` and `type: "environment"` require a
        string `default`, `type: "boolean"` requires a boolean one,
        `type: "number"` requires a number, and `type: "choice"` requires
        `options`. A `workflow_dispatch` input is therefore only schema-valid
        when `default` matches what `type` declares. The paths above pin the
        `boolean` branch, which is the one the counterexample violates. (The
        2026-09-01 refresh restructured this from an `allOf` of `if`/`then`
        clauses into the `oneOf` above; the rule is unchanged, the paths are
        not, and these rows failed until they were repointed -- which is the
        point of pinning them positionally.)
      unenforced: >-
        Neither port enforces any of it. Both type `default` as the
        UNCONDITIONAL union of the branches -- `str | bool | int | float` in
        Python, `string | boolean | number` in TypeScript, bound to the
        Snapshot by schema/conformance-inputs.yml -- and neither looks at
        `type` when validating `default`. So `type: "boolean"` with
        `default: "yes"` is accepted by both ports and rejected by the
        Snapshot, and ghagen will happily emit a workflow GitHub refuses.
        `type: "choice"` without `options` is unenforced by the same omission.
        This is the only cross-field dependency in any of the models, and
        binding it would mean a validator that reads a sibling field -- a new
        capability in both `ModelSpec` and the emitter's construction-time
        checks, since `patterns` (the one existing per-field grammar hook) sees
        a single value with no access to the rest of the model. Recorded rather
        than built: one rule does not justify the mechanism, and an
        unimplemented rule left unrecorded is how a "known limit" becomes a bug
        report.
      counterexample:
        type: boolean
        default: "yes"

# ---------------------------------------------------------------------------
# Undeclared-key gaps: the sweep in the other direction.
#
# Everything above records something upstream that ghagen does NOT emit. This
# section records the inverse: a key ghagen DOES emit that the Snapshot does
# not declare for that scope.
#
# The property sweep only ever asserted upstream <= model. Nothing asserted
# model <= upstream, and in Python nothing could: a `ModelSpec.yaml_keys` value
# is a free string, so `"shell": "shel"` -- or a key the platform retired two
# years ago -- passed every check in the family while ghagen emitted a workflow
# the platform refuses. TypeScript had a compile-time answer for some of its
# specs (`satisfies Record<keyof StepInput, keyof SchemaStep>`, which is also
# how the 2026-09-01 `definitions.container` split surfaced, as TS2724), but
# there are seven such clauses, covering eight of the sweep's twenty-nine
# scopes, and Python had no peer for any of them. `test_scope_emits_only_declared_keys` /
# "scope emits only declared keys" is that peer, for every scope, in both ports.
#
# A row here is held to the same three claims as a property gap: the model must
# still emit the name (else the row is closed), the Snapshot must still not
# declare it (else it is stale and the key is ordinary coverage), and this
# section's snapshot/scope key set must equal the sweep's
# (`test_undeclared_set_matches_sweep` / "undeclared set matches the sweep") --
# which is what makes the currently-empty lists load-bearing rather than
# decorative, exactly as it is for the property gaps.
#
# Every entry needs an inline comment saying why ghagen emits a key upstream
# does not declare. There are none today: every key both ports emit is an
# upstream-declared property name.
undeclared:
  workflow_schema:
    workflow: []
    job: []
    step: []
    on: []
    pushTrigger: []
    prTrigger: []
    scheduleTrigger: []
    workflowDispatch: []
    workflowDispatchInput: []
    workflowCall: []
    workflowCallInput: []
    workflowCallOutput: []
    workflowCallSecret: []
    permissions: []
    container: []
    serviceContainer: []
    strategy: []
    concurrency: []
    defaults: []
    defaultsRun: []
    environment: []
    imageSnapshot: []
  action_schema:
    action: []
    compositeRuns: []
    dockerRuns: []
    nodeRuns: []
    actionInput: []
    actionOutput: []
    branding: []

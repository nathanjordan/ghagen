[project]
name = "ghagen"
version = "0.5.0"
description = "Generate GitHub Actions workflow YAML from Python code"
readme = "README.md"
authors = [{ name = "Nathan Jordan", email = "nathan.m.jordan@gmail.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["github-actions", "ci", "cd", "yaml", "workflow", "code-generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]

# `cli/main.py` runs the Typer command with `standalone_mode=False` and handles the
# click exceptions that escape, so click is a direct dependency and must be declared
# rather than inherited from typer. typer 0.25 vendors click as `typer._click` and
# drops the top-level dependency, which breaks those imports -- hence the ceiling.
# See docs/adr/0009-click-is-a-declared-dependency.md.
dependencies = [
  "click>=8.2.1",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "typer>=0.12,<0.25",
]

[project.urls]
Repository = "https://github.com/nathanjordan/ghagen"

[project.scripts]
ghagen = "ghagen.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/python/src/ghagen"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-snapshot",
  "ruff",
  "pyright",
  "httpx",
  "jsonschema",
  "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# `scripts/ghagen_schema/` (see ADR-0003) is dev tooling, not shipped package code, but it is
# still Python source the `py` gate scope must cover -- see docs/issues/17.
src = ["packages/python/src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# scripts/ghagen_schema/ is dev tooling (ADR-0003), not shipped package code, but it is still
# Python source the `py` gate scope must cover -- see docs/issues/17.
include = ["packages/python/src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests"]
# The dev-only schema orchestrator lives at scripts/ghagen_schema/ (repo root,
# not the shipped ghagen package -- see ADR-0003). pytest natively prepends
# these to sys.path so the schema tests can `import ghagen_schema` as a package,
# replacing the old sys.path hack in test_schema/conftest.py.
pythonpath = ["scripts"]

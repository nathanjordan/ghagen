# The one exit-code contract. Both ports drive this through main().
#
#   0  success
#   1  expected failure (stale files, unresolved refs, config not found)
#   2  usage error (unknown command/option, missing or invalid option value)
#
# Most rows are project-independent: they load no user config module, so the
# driver only has to chdir into an empty directory.
#
# A row MAY carry an optional `project:` key naming a directory under
# `fixtures/cli-exit-code-projects/`. The driver copies that directory into a
# fresh temp dir and chdirs there instead of into an empty one. This exists
# because the codes that depend on *user code running* -- a config module that
# raises -- are structurally invisible to an empty-directory driver, and that
# is exactly the class in which the two ports drifted (Python propagated the
# exception where TypeScript returned 1). A fixture project holds BOTH ports'
# entrypoints; their search paths are disjoint, so each port discovers its own
# and never sees the other's.
- id: help
  argv: ["--help"]
  exit: 0
- id: no-args
  argv: []
  exit: 2
- id: subapp-no-subcommand
  argv: ["deps"]
  exit: 2
- id: unknown-command
  argv: ["bogus-command"]
  exit: 2
- id: unknown-option
  argv: ["synth", "--bogus"]
  exit: 2
- id: missing-option-argument
  argv: ["init", "--outdir"]
  exit: 2
- id: bad-format-value
  argv: ["deps", "upgrade", "--format", "bogus"]
  exit: 2
- id: bad-mode-value
  argv: ["deps", "upgrade", "--mode", "bogus"]
  exit: 2
- id: config-not-found-discovery
  argv: ["synth"]
  exit: 1
- id: config-not-found-flag
  argv: ["synth", "--config", "does-not-exist.py"]
  exit: 1
# The class the empty-directory rows structurally cannot reach: user code runs
# and raises. Python propagated the exception here instead of returning a code.
- id: config-module-raises
  argv: ["synth"]
  project: config-raises
  exit: 1
